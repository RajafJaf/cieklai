<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slots Mahjong Wins - Cloud Ultimate Edition</title>

    <style>
        /* ===================================================
           STYLE RESET & VARIABLE DEFINITIONS
           =================================================== */
        :root {
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.5);
            --dark-bg: #0b0c10;
            --card-bg: #1f2833;
            --text-light: #c5c6c7;
            --neon-green: #66fcf1;
            --neon-red: #ff4d4d;
            --purple-dark: #1a052e;
            --purple-light: #05010d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        input {
            user-select: text;
            -webkit-user-select: text;
        }

        select {
            user-select: text;
            -webkit-user-select: text;
        }

        /* ===================================================
           MAIN BODY & BACKGROUND EFFECT
           =================================================== */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, var(--purple-dark) 0%, var(--purple-light) 100%);
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            color: #ffffff;
            padding: 15px 10px;
        }

        .bg-glow {
            position: absolute;
            width: 100%;
            max-width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.2) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* ===================================================
           TAMPILAN GAME INTERFACE UTAMA (OPTIMASI HP)
           =================================================== */
        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            z-index: 5;
            padding-top: 60px;
            padding-bottom: 20px;
        }

        h1.game-title {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(to bottom, #ffffff 20%, #ffd700 50%, #b39200 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 3px 6px rgba(0,0,0,0.5);
            margin-bottom: 2px;
            letter-spacing: 1px;
        }

        .user-badge {
            font-size: 12px;
            margin-bottom: 15px;
            color: #a193b8;
        }

        .user-badge span {
            color: var(--gold);
            font-weight: bold;
        }

        .depo-top-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(180deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            padding: 10px 18px;
            font-size: 12px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,114,255,0.3);
            z-index: 10;
        }

        .depo-top-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ===================================================
           REELS MACHINE MECHANISM VISUAL (OPTIMASI HP)
           =================================================== */
        .machine-wrapper {
            background: linear-gradient(145deg, #2c1a4d, #140b24);
            padding: 12px 8px;
            border-radius: 18px;
            border: 3px solid var(--gold);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 15px var(--gold-glow);
            margin: 15px 0;
            position: relative;
        }

        .machine {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .reel {
            width: 18%;
            max-width: 75px;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: linear-gradient(180deg, #ffffff 0%, #e6e6e6 100%);
            border-radius: 10px;
            border: 2px solid #44335c;
            position: relative;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6), 0 3px 5px rgba(0,0,0,0.3);
        }

        .reel.spinning {
            filter: blur(3px);
        }

        .track {
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            will-change: transform;
        }

        .item {
            width: 100%;
            height: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 7vw;
            max-size: 44px;
        }

        @media (min-width: 480px) {
            .item { font-size: 38px; }
            h1.game-title { font-size: 34px; }
        }

        /* ===================================================
           DASHBOARD INFORMATION DISPLAY BOXES
           =================================================== */
        .info {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .box {
            background: rgba(20, 10, 35, 0.8);
            padding: 10px 5px;
            border-radius: 10px;
            border: 1.5px solid #44335c;
            flex: 1;
            min-width: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .box-label {
            font-size: 9px;
            color: #a193b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .box-value {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .box-value.highlight {
            color: #50fa7b;
            text-shadow: 0 0 8px rgba(80,250,123,0.3);
        }

        /* ===================================================
           GAME CONTROLS BUTTONS DESIGN
           =================================================== */
        .controls {
            margin-top: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-control {
            padding: 12px 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
            width: 100%;
        }

        #spinBtn {
            grid-column: span 2;
            background: linear-gradient(180deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            font-size: 18px;
            padding: 14px 10px;
            border: 2px solid #2ecc71;
            box-shadow: 0 0 12px rgba(46,204,113,0.4);
            border-radius: 30px;
        }

        #turboBtn {
            background: linear-gradient(180deg, #7f8c8d 0%, #34495e 100%);
            color: white;
        }

        #turboBtn.active {
            background: linear-gradient(180deg, #9b59b6 0%, #8e44ad 100%);
            box-shadow: 0 0 12px rgba(155,89,182,0.6);
            border: 1px solid #9b59b6;
        }

        #autoMenuBtn {
            background: linear-gradient(180deg, #f39c12 0%, #d35400 100%);
            color: white;
        }

        .btn-bet-custom {
            background: #34495e; 
            color: white;
            grid-column: span 2;
        }

        #result {
            margin-top: 15px;
            font-size: 24px;
            font-weight: 900;
            min-height: 35px;
            background: linear-gradient(to right, #00ffcc, #00ff66);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,255,200,0.3);
        }

        /* ===================================================
           MODAL DIALOG DICTIONARY CONFIGURATIONS
           =================================================== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 200;
            backdrop-filter: blur(6px);
            padding: 20px;
        }

        .modal-content {
            background: #151026;
            color: white;
            padding: 25px 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            border: 2px solid #44335c;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: var(--gold);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .option {
            width: 100%;
            margin: 8px 0;
            padding: 12px;
            font-weight: bold;
            border-radius: 12px;
            border: 1px solid #44335c;
            cursor: pointer;
            background: #23193d;
            color: white;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .depo-input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #44335c;
            background: #120a21;
            color: white;
            outline: none;
            text-align: center;
            font-size: 16px;
            margin-bottom: 15px;
        }

        /* ===================================================
           TAMPILAN SPECIAL ULTRA CELEBRATION MODAL JACKPOT
           =================================================== */
        #jackpotModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .jp-card {
            background: radial-gradient(circle, #2d0a4e 0%, #110322 100%);
            color: gold;
            border: 4px solid var(--gold);
            width: 100%;
            max-width: 360px;
            padding: 30px 20px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 0 40px var(--gold), inset 0 0 25px rgba(255,215,0,0.2);
            position: relative;
            animation: popUp 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #jpEmojiBox {
            width: 90px;
            height: 90px;
            line-height: 90px;
            margin: 0 auto 20px auto;
            background: white;
            border: 3px solid var(--gold);
            border-radius: 18px;
            font-size: 50px;
            box-shadow: 0 0 25px rgba(255,255,255,0.85), inset 0 0 15px rgba(0,0,0,0.2);
        }

        #jpCounterText {
            font-size: 30px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 12px #2ecc71, 0 0 4px #2ecc71;
            margin-bottom: 25px;
        }

        .shake-screen {
            animation: screenShake 0.4s linear infinite;
        }

        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-3px, 2px); }
            20%, 40%, 60%, 80% { transform: translate(3px, -2px); }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <button class="depo-top-btn" id="depoTopBtn" onclick="openDepo()">DEPOSIT</button>

    <div class="container" id="mainContainer">
        <h1 class="game-title">MAHJONG WINS</h1>
        <div class="user-badge">Mode Bermain: <span>GUEST PLAYER</span></div>

        <div class="machine-wrapper">
            <div class="machine">
                <div class="reel"><div class="track" id="r0"></div></div>
                <div class="reel"><div class="track" id="r1"></div></div>
                <div class="reel"><div class="track" id="r2"></div></div>
                <div class="reel"><div class="track" id="r3"></div></div>
                <div class="reel"><div class="track" id="r4"></div></div>
            </div>
        </div>

        <div class="info">
            <div class="box">
                <div class="box-label">Saldo</div>
                <div class="box-value highlight">Rp<span id="saldo">0,00</span></div>
            </div>
            <div class="box">
                <div class="box-label">bet</div>
                <div class="box-value">Rp<span id="betText">0,50</span></div>
            </div>
            <div class="box" id="autoSpinBox" style="display: none;">
                <div class="box-label">Sisa Auto</div>
                <div class="box-value" style="color:var(--gold);"><span id="autoCountText">0</span>x</div>
            </div>
        </div>

        <div class="controls">
            <button id="turboBtn" class="btn-control" onclick="toggleTurbo()">TURBO: OFF</button>
            <button id="autoMenuBtn" class="btn-control" onclick="openAutoMenu()">AUTO</button>
            <button class="btn-control btn-bet-custom" onclick="openBet()">UBAH BET</button>
            <button id="spinBtn" class="btn-control" onclick="handleSpinClick()">SPIN</button>
        </div>
        
        <div id="result"></div>
    </div>

    <div class="modal" id="depoModal">
        <div class="modal-content">
            <h3>Menu Deposit</h3>
            <p style="font-size: 12px; color: #a193b8; margin-bottom: 15px;">Maksimal Rp100,00 per jam</p>
            <input type="number" id="depoAmount" class="depo-input" placeholder="Masukkan Jumlah (Max 100)" min="0.01" max="100" step="0.01">
            <button class="option" style="background: #2ecc71; color: white; border: none;" onclick="prosesDepo()">DEPOSIT SEKARANG</button>
            <button class="option" style="background:#cc2a36; color: white; margin-top:10px; border:none;" onclick="closeDepo()">BATAL</button>
        </div>
    </div>

    <div class="modal" id="betModal">
        <div class="modal-content">
            <h3>Pilih Jumlah Taruhan</h3>
            <button class="option" onclick="setBet(0.50)">Rp0,50</button>
            <button class="option" onclick="setBet(1.00)">Rp1,00</button>
            <button class="option" onclick="setBet(5.00)">Rp5,00</button>
            <button class="option" onclick="setBet(10.00)">Rp10,00</button>
            <button class="option" style="background:#cc2a36; color: white; margin-top:15px; border:none;" onclick="closeBet()">BATAL</button>
        </div>
    </div>

    <div class="modal" id="autoModal">
        <div class="modal-content">
            <h3>Pilih Putaran Otomatis</h3>
            <button class="option" onclick="startAutoSpin(10)">Auto Spin 10x</button>
            <button class="option" onclick="startAutoSpin(50)">Auto Spin 50x</button>
            <button class="option" onclick="startAutoSpin(100)">Auto Spin 100x</button>
            <button class="option" style="background:#cc2a36; color: white; margin-top:15px; border:none;" onclick="closeAutoMenu()">BATAL</button>
        </div>
    </div>

    <div class="modal" id="jackpotModal">
        <div class="jp-card">
            <h2 style="font-size: 22px; text-shadow: 0 0 15px rgba(255,215,0,0.6); margin-bottom: 5px; letter-spacing: 1px;">🎉 GRAND JACKPOT 🎉</h2>
            <h3 style="color: #ffffff; margin-bottom: 15px; font-size:13px; letter-spacing:1px;">5 KEMBAR IDENTIK MUTLAK</h3>
            
            <div id="jpEmojiBox">🀄</div>
            
            <p style="color: #a193b8; font-size: 11px; margin-bottom: 4px; text-transform:uppercase;">Kemenangan Bersih:</p>
            <div id="jpCounterText">Rp0,00</div>
            
            <button class="option" style="background: linear-gradient(180deg, #ffe600 0%, #b3a200 100%); color: black; font-size: 14px; padding: 12px; border:none; box-shadow:0 5px 15px rgba(0,0,0,0.4);" onclick="closeJackpotModal()">AMBIL HADIAH CASH</button>
        </div>
    </div>

    <script>
        // =========================================================================
        // DATA DICTIONARY HADIAH 11 EMOJI MAHJONG WINS
        // =========================================================================
        const emojiSettings = {
            "🀄": { nama: "Green Mahjong", x5: 9173.32, x4: 8.80, x3: 1.50 },
            "🐉": { nama: "Dragon Red", x5: 1888.88, x4: 6.50, x3: 1.20 },
            "⚡": { nama: "Zeus Spark", x5: 750.00, x4: 5.00, x3: 1.00 },
            "👹": { nama: "Oni Mask", x5: 350.00, x4: 4.50, x3: 0.90 },
            "🎭": { nama: "Kabuki Face", x5: 180.00, x4: 3.80, x3: 0.75 },
            "🪙": { nama: "Gold Coin", x5: 95.50, x4: 2.80, x3: 0.60 },
            "⛩️": { nama: "Torii Gate", x5: 60.00, x4: 2.20, x3: 0.50 },
            "🐅": { nama: "Tiger Claw", x5: 45.00, x4: 1.80, x3: 0.40 },
            "🌸": { nama: "Sakura Bloom", x5: 30.00, x4: 1.50, x3: 0.30 },
            "🏮": { nama: "Red Lantern", x5: 20.00, x4: 1.00, x3: 0.20 },
            "🎋": { nama: "Lucky Bamboo", x5: 15.00, x4: 0.80, x3: 0.15 }
        };
        
        const fruits = Object.keys(emojiSettings);

        let saldo = parseFloat(localStorage.getItem('slot_saldo')) || 10.00;
        let bet = 0.50;
        let spinning = false;
        let isTurbo = false;
        let forceStopRequested = false;
        let autoSpinCount = 0;
        let isAutoSpinning = false;
        const intervals = {};
        let jackpotPromiseResolver = null;
        let soundInterval = null;

        // SYSTEM WEB AUDIO API ENGINE UNTUK MENGHASILKAN SUARA SECARA SINTETIS TANPA FILE MP3
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSpinTickSound() {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch(e) {}
        }

        function playJackpotSound() {
            try {
                let j = 0;
                let interval = setInterval(() => {
                    if (j > 12) { clearInterval(interval); return; }
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    let freq = j % 2 === 0 ? 587.33 : 880; // Efek nada sirine berselingan tinggi-rendah
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                    j++;
                }, 150);
            } catch(e) {}
        }

        function formatMurni(nilai) {
            return nilai.toLocaleString("id-ID", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // =========================================================================
        // DEPOSIT CONTROLLER (BATAS BARU: 100,00)
        // =========================================================================
        function openDepo() {
            if (!spinning && !isAutoSpinning) {
                document.getElementById("depoModal").style.display = "flex";
            }
        }

        function closeDepo() {
            document.getElementById("depoModal").style.display = "none";
            document.getElementById("depoAmount").value = "";
        }

        function prosesDepo() {
            const amountInput = document.getElementById("depoAmount").value;
            const amount = parseFloat(amountInput);

            if (isNaN(amount) || amount <= 0) {
                alert("Masukkan jumlah deposit yang valid!");
                return;
            }

            if (amount > 100.00) {
                alert("Gagal! Maksimal deposit adalah Rp100,00 per jam.");
                return;
            }

            const terakhirDepo = localStorage.getItem('terakhir_depo');
            const sekarang = Date.now();

            if (terakhirDepo && (sekarang - terakhirDepo < 3600000)) {
                const sisaWaktu = Math.ceil((3600000 - (sekarang - terakhirDepo)) / 60000);
                alert(`Gagal! Silakan tunggu ${sisaWaktu} menit lagi untuk dapat depo kembali.`);
                return;
            }

            saldo += amount;
            localStorage.setItem('slot_saldo', saldo);
            localStorage.setItem('terakhir_depo', sekarang);
            
            alert(`Deposit Rp${formatMurni(amount)} Berhasil!`);
            closeDepo();
            updateUI();
            cekCooldownDepo();
        }

        function cekCooldownDepo() {
            const terakhirDepo = localStorage.getItem('terakhir_depo');
            const sekarang = Date.now();
            const btn = document.getElementById("depoTopBtn");

            if (terakhirDepo && (sekarang - terakhirDepo < 3600000)) {
                const sisaDetik = Math.ceil((3600000 - (sekarang - terakhirDepo)) / 1000);
                let menit = Math.floor(sisaDetik / 60);
                let detik = sisaDetik % 60;
                
                btn.disabled = true;
                btn.textContent = `WAIT (${menit}m ${detik}s)`;
                setTimeout(cekCooldownDepo, 1000);
            } else {
                btn.disabled = false;
                btn.textContent = "DEPOSIT";
            }
        }

        // =========================================================================
        // CORE SLOT GAME MECHANIC
        // =========================================================================
        function randomFruit() {
            return fruits[Math.floor(Math.random() * fruits.length)];
        }

        function randomFruitExcept(fb) {
            const al = fruits.filter(f => !fb.includes(f));
            return al[Math.floor(Math.random() * al.length)];
        }

        function createTrack(id) {
            const track = document.getElementById(id);
            track.innerHTML = "";
            for (let i = 0; i < 12; i++) {
                const div = document.createElement("div");
                div.className = "item";
                div.textContent = randomFruit();
                track.appendChild(div);
            }
        }
        
        ["r0", "r1", "r2", "r3", "r4"].forEach(createTrack);

        function startReel(id) {
            const track = document.getElementById(id);
            track.parentElement.classList.add("spinning");
            
            let speed = isTurbo ? 50 : 110;
            
            intervals[id] = setInterval(() => {
                const item = document.createElement("div");
                item.className = "item";
                item.textContent = randomFruit();
                track.prepend(item);
                
                track.style.transition = "none";
                track.style.transform = "translateY(-100%)";
                track.offsetHeight;
                
                track.style.transition = `transform ${speed / 1000}s linear`;
                track.style.transform = "translateY(0px)";
                
                while (track.children.length > 12) {
                    track.removeChild(track.lastElementChild);
                }
            }, speed);
        }

        function stopReel(id, forcedFruit = null) {
            clearInterval(intervals[id]);
            const track = document.getElementById(id);
            track.parentElement.classList.remove("spinning");
            
            let fruit = forcedFruit ? forcedFruit : randomFruit();
            track.innerHTML = `<div class="item">${fruit}</div>`;
            return fruit;
        }

        function wait(ms) {
            let waktuTunggu = isTurbo ? ms * 0.15 : ms;
            return new Promise(resolve => setTimeout(resolve, waktuTunggu));
        }

        function jalankanCounterJackpot(targetHadiah) {
            const counterElement = document.getElementById("jpCounterText");
            let start = null;
            
            function step(timestamp) {
                if (!start) start = timestamp;
                const progress = Math.min((timestamp - start) / 2000, 1);
                counterElement.textContent = "Rp" + formatMurni(progress * targetHadiah);
                
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    counterElement.textContent = "Rp" + formatMurni(targetHadiah);
                }
            }
            window.requestAnimationFrame(step);
        }

        function closeJackpotModal() {
            document.getElementById("jackpotModal").style.display = "none";
            if (jackpotPromiseResolver) {
                jackpotPromiseResolver();
                jackpotPromiseResolver = null;
            }
        }

        function toggleTurbo() {
            isTurbo = !isTurbo;
            const btn = document.getElementById("turboBtn");
            if (isTurbo) {
                btn.textContent = "TURBO: ON";
                btn.classList.add("active");
            } else {
                btn.textContent = "TURBO: OFF";
                btn.classList.remove("active");
            }
        }

        function updateUI() {
            document.getElementById("saldo").textContent = formatMurni(saldo);
            document.getElementById("betText").textContent = formatMurni(bet);
            
            if (isAutoSpinning) {
                document.getElementById("autoSpinBox").style.display = "block";
                document.getElementById("autoCountText").textContent = autoSpinCount;
                document.getElementById("autoMenuBtn").textContent = "STOP";
            } else {
                document.getElementById("autoSpinBox").style.display = "none";
                document.getElementById("autoMenuBtn").textContent = "AUTO";
            }
        }

        function openBet() {
            if (!spinning && !isAutoSpinning) {
                document.getElementById("betModal").style.display = "flex";
            }
        }

        function closeBet() {
            document.getElementById("betModal").style.display = "none";
        }

        function setBet(v) {
            bet = v;
            updateUI();
            closeBet();
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateUI();
            cekCooldownDepo();
        });

        function openAutoMenu() {
            if (isAutoSpinning) {
                isAutoSpinning = false;
                updateUI();
                return;
            }
            if (!spinning) {
                document.getElementById("autoModal").style.display = "flex";
            }
        }

        function closeAutoMenu() {
            document.getElementById("autoModal").style.display = "none";
        }

        function handleSpinClick() {
            if (!isAutoSpinning) {
                if (!spinning) {
                    runSingleSpin();
                } else {
                    forceStopRequested = true;
                }
            }
        }

        function startAutoSpin(j) {
            closeAutoMenu();
            autoSpinCount = j;
            isAutoSpinning = true;
            updateUI();
            runSingleSpin();
        }

        function pemicuAnimasiMenang(tipe, emoji) {
            const container = document.getElementById("mainContainer");
            if (tipe === 5) {
                playJackpotSound(); // Memutar efek suara jackpot
                container.classList.add("shake-screen");
                setTimeout(() => { container.classList.remove("shake-screen"); }, 2500);
                
                for (let i = 0; i < 30; i++) {
                    const p = document.createElement("div");
                    p.className = "particle p-coin-jp";
                    p.textContent = "🪙";
                    p.style.left = "50%";
                    p.style.top = "50%";
                    p.style.fontSize = (20 + Math.random() * 20) + "px";
                    
                    const sudut = Math.random() * Math.PI * 2;
                    const jarak = 100 + Math.random() * 150;
                    
                    p.style.setProperty('--cx', Math.cos(sudut) * jarak + "px");
                    p.style.setProperty('--cy', Math.sin(sudut) * jarak + "px");
                    p.style.setProperty('--dur', (0.8 + Math.random() * 0.8) + "s");
                    
                    document.getElementById("jackpotModal").appendChild(p);
                    setTimeout(() => { p.remove(); }, 2000);
                }
            }
        }

        async function runSingleSpin() {
            if (spinning) return;
            
            if (saldo < bet) {
                alert("Sisa Tunai Tidak Mencukupi, Silakan Isi Ulang Lewat Menu Deposit!");
                isAutoSpinning = false;
                updateUI();
                return;
            }

            // Memulai loop audio detak putaran mekanis roda
            if (audioCtx.state === 'suspended') audioCtx.resume();
            soundInterval = setInterval(playSpinTickSound, isTurbo ? 40 : 90);

            spinning = true;
            forceStopRequested = false;
            saldo -= bet;
            localStorage.setItem('slot_saldo', saldo);
            updateUI();
            document.getElementById("result").textContent = "";

            startReel("r0");
            startReel("r1");
            startReel("r2");
            startReel("r3");
            startReel("r4");

            let targetCombo = 0;
            let winEmoji = "";
            let rng = Math.random() * 100;

            // CHANCE KEMBAR 5 DI BAGI 10 (DARI 0.08% MENJADI 0.008% SETIAP EMOJI)
            if (rng < 0.008) { targetCombo = 5; winEmoji = "🀄"; } 
            else if (rng < 0.016) { targetCombo = 5; winEmoji = "🐉"; } 
            else if (rng < 0.024) { targetCombo = 5; winEmoji = "⚡"; } 
            else if (rng < 0.032) { targetCombo = 5; winEmoji = "👹"; } 
            else if (rng < 0.040) { targetCombo = 5; winEmoji = "🎭"; } 
            else if (rng < 0.048) { targetCombo = 5; winEmoji = "🪙"; } 
            else if (rng < 0.056) { targetCombo = 5; winEmoji = "⛩️"; } 
            else if (rng < 0.064) { targetCombo = 5; winEmoji = "🐅"; } 
            else if (rng < 0.072) { targetCombo = 5; winEmoji = "🌸"; } 
            else if (rng < 0.080) { targetCombo = 5; winEmoji = "🏮"; } 
            else if (rng < 0.088) { targetCombo = 5; winEmoji = "🎋"; } 
            else if (rng < 2.5) { targetCombo = 4; } 
            else if (rng < 7.5) { targetCombo = 3; } 
            else { targetCombo = 0; }

            let finalResults = [];
            if (targetCombo >= 3) {
                if (winEmoji === "") winEmoji = randomFruit();
                for (let i = 0; i < targetCombo; i++) {
                    finalResults.push(winEmoji);
                }
                while (finalResults.length < 5) {
                    finalResults.push(randomFruitExcept([winEmoji]));
                }
                finalResults.sort(() => Math.random() - 0.5);
            } else {
                let e0 = randomFruit();
                let e1 = randomFruitExcept([e0]);
                let e2 = randomFruitExcept([e0, e1]);
                finalResults = [e0, e1, e2, randomFruit(), randomFruit()];
            }

            if (!forceStopRequested) await wait(850);
            stopReel("r0", finalResults[0]);
            if (!forceStopRequested) await wait(250);
            stopReel("r1", finalResults[1]);
            if (!forceStopRequested) await wait(250);
            stopReel("r2", finalResults[2]);
            if (!forceStopRequested) await wait(250);
            stopReel("r3", finalResults[3]);
            if (!forceStopRequested) await wait(250);
            stopReel("r4", finalResults[4]);

            // Menghentikan efek suara putaran setelah semua roda berhenti bergerak
            clearInterval(soundInterval);

            let finalCounts = {};
            finalResults.forEach(x => { finalCounts[x] = (finalCounts[x] || 0) + 1; });
            
            let menangEmoji = "";
            let jumlahKembar = 0;
            
            for (let em in finalCounts) {
                if (finalCounts[em] > jumlahKembar) {
                    jumlahKembar = finalCounts[em];
                    menangEmoji = em;
                }
            }

            let hadiah = 0;
            if (jumlahKembar >= 3) {
                let multiplier = emojiSettings[menangEmoji]["x" + jumlahKembar];
                hadiah = bet * multiplier;
                pemicuAnimasiMenang(jumlahKembar, menangEmoji);
                document.getElementById("result").textContent = `WIN Rp${formatMurni(hadiah)}`;
            }

            saldo += hadiah;
            localStorage.setItem('slot_saldo', saldo);
            spinning = false;
            updateUI();

            if (jumlahKembar === 5) {
                document.getElementById("jpEmojiBox").textContent = menangEmoji;
                document.getElementById("jpCounterText").textContent = "Rp0,00";
                document.getElementById("jackpotModal").style.display = "flex";
                jalankanCounterJackpot(hadiah);
                await new Promise(r => { jackpotPromiseResolver = r; });
            }

            if (isAutoSpinning) {
                autoSpinCount--;
                if (autoSpinCount <= 0) isAutoSpinning = false;
                updateUI();
                if (isAutoSpinning) {
                    await wait(1600);
                    if (isAutoSpinning) runSingleSpin();
                }
            }
        }
    </script>
</body>
</html>
