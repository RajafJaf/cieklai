<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slot Gacor Ultra Set - History Version</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
    -webkit-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

input, textarea {
    user-select: text;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,red,gray,cyan);
    overflow: hidden;
    position: relative;
}

.container{
    text-align:center;
    color:white;
    width:95%;
    max-width:700px;
    position: relative;
    transition: transform 0.1s ease;
    padding-bottom: 80px;
}

/* Tombol Riwayat di Pojok Kanan Atas Layar Utama */
.history-top-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background-color: #008cba;
    color: white;
    padding: 10px 20px;
    font-size: 14px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    z-index: 100;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}
.history-top-btn:hover {
    opacity: 0.9;
}

h1{
    margin-bottom:20px;
    margin-top: 20px;
}

.machine{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:20px 0;
}

.reel{
    width:65px;
    height:65px;
    overflow:hidden;
    background:white;
    border-radius:10px;
    border:3px solid gold;
    position:relative;
    box-shadow:0 4px 10px rgba(0,0,0,.25);
}

.reel.spinning{
    filter:blur(2px);
}

.track{
    position:absolute;
    width:100%;
    top:0;
    left:0;
    will-change:transform;
}

.item{
    width:100%;
    height:65px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    user-select:none;
}

.info{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.box{
    background:rgba(255,255,255,.2);
    padding:10px 15px;
    border-radius:10px;
}

.controls{
    margin-top:15px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
}

button{
    padding:12px 20px;
    margin:5px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
    outline: none;
}

button:hover{
    opacity:.9;
}

#spinBtn {
    background-color: #4CAF50;
    color: white;
    min-width: 90px;
}

#autoMenuBtn {
    background-color: #ff9800;
    color: white;
}

#turboBtn {
    background-color: #9c27b0;
    color: white;
}
#turboBtn.active {
    background-color: #e91e63;
    box-shadow: 0 0 10px #e91e63;
}

#depoBtn {
    position: fixed;
    bottom: 15px;
    left: 15px;
    margin: 0;
    z-index: 100;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    background-color: #4CAF50;
    color: white;
}

#depoBtn:disabled {
    background-color: #555 !important;
    color: #aaa;
    cursor: not-allowed;
    opacity: 1;
    box-shadow: none;
}

#wdBtn {
    position: fixed;
    bottom: 15px;
    right: 15px;
    margin: 0;
    z-index: 100;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    background-color: #00bcd4;
    color: white;
}

.btn-stop {
    background-color: #ff4d4d !important;
    color: white;
}

#result{
    margin-top:15px;
    font-size:24px;
    font-weight:bold;
    min-height: 35px;
}

/* Style list riwayat di dalam modal */
.history-list {
    max-height: 200px;
    overflow-y: auto;
    text-align: left;
    font-size: 13px;
    margin: 10px 0;
    padding: 5px;
    border: 1px solid #ddd;
    border-radius: 5px;
}
.history-item {
    padding: 4px 0;
    border-bottom: 1px dashed #eee;
}
.history-item:last-child {
    border-bottom: none;
}
.text-depo { color: #4CAF50; font-weight: bold; }
.text-win { color: #e91e63; font-weight: bold; }

/* Animasi Partikel */
.particle {
    position: absolute;
    pointer-events: none;
    z-index: 999;
    user-select: none;
}

@keyframes floatUp {
    0% { transform: translateY(0) scale(0.5); opacity: 1; }
    100% { transform: translateY(-150px) scale(1.2); opacity: 0; }
}
.p-triple {
    animation: floatUp 0.8s ease-out forwards;
}

@keyframes explodeSpin {
    0% { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(720deg); opacity: 0; }
}
.p-quad {
    animation: explodeSpin 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}

@keyframes rainDown {
    0% { transform: translateY(-10vh) scale(0.8) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(110vh) scale(1.5) rotate(360deg); opacity: 0; }
}
.p-jackpot {
    animation: rainDown var(--dur) linear forwards;
}

@keyframes screenShake {
    0%, 100% { transform: translate(0, 0); }
    10%, 30%, 50%, 70%, 90% { transform: translate(-8px, 4px); }
    20%, 40%, 60%, 80% { transform: translate(8px, -4px); }
}
.shake-screen {
    animation: screenShake 0.5s linear infinite;
}

/* Modal */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    justify-content:center;
    align-items:center;
    z-index: 101;
}

.modal-content{
    background:white;
    color:black;
    padding:20px;
    border-radius:15px;
    width:320px;
    text-align: center;
}

.modal-content h3{
    margin-bottom:10px;
}

.option{
    width:100%;
    margin:5px 0;
}

/* Style Khusus Input & Tampilan Withdraw */
.wd-input {
    width: 100%;
    padding: 10px;
    margin: 5px 0 12px 0;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    text-align: center;
    outline: none;
}
.wd-input:focus {
    border-color: #00bcd4;
}
.wd-label {
    display: block;
    text-align: left;
    font-size: 13px;
    font-weight: bold;
    color: #555;
    margin-top: 5px;
}
.success-checkmark {
    font-size: 50px;
    color: #4CAF50;
    margin-bottom: 10px;
    line-height: 1;
}
.wd-success-text {
    color: #4CAF50;
    font-weight: bold;
    font-size: 20px;
    margin-bottom: 15px;
}
</style>
</head>
<body>

<audio id="bgMusic" src="mahjong-bgm.mp3" loop></audio>

<!-- Tombol Riwayat di pojok kanan atas -->
<button class="history-top-btn" onclick="openHistoryModal()">RIWAYAT</button>

<button id="depoBtn" onclick="openDeposit()">depo</button>
<button id="wdBtn" onclick="openWithdraw()">Withdraw</button>

<div class="container" id="mainContainer">

    <h1>🀄SLOT GACOR🀄</h1>

    <div class="machine">
        <div class="reel"><div class="track" id="r0"></div></div>
        <div class="reel"><div class="track" id="r1"></div></div>
        <div class="reel"><div class="track" id="r2"></div></div>
        <div class="reel"><div class="track" id="r3"></div></div>
        <div class="reel"><div class="track" id="r4"></div></div>
    </div>

    <div class="info">
        <div class="box">
            Saldo: Rp<span id="saldo">10,00</span>
        </div>

        <div class="box">
            Bet: Rp<span id="betText">0,50</span>
        </div>
        
        <div class="box" id="autoSpinBox" style="display: none;">
            Auto: <span id="autoCountText">0</span>x
        </div>
    </div>

    <div class="controls">
        <button id="turboBtn" onclick="toggleTurbo()">TURBO: OFF</button>
        <button onclick="openBet()">Bet</button>
        <button id="spinBtn" onclick="handleSpinClick()">SPIN</button>
        <button id="autoMenuBtn" onclick="openAutoMenu()">AUTO</button>
    </div>

    <div id="result"></div>

</div>

<div class="modal" id="depositModal">
    <div class="modal-content">
        <h3>deposit (Maks Rp100,00)</h3>
        <button class="option" onclick="addPoints(100.00)">Rp100,00</button>
        <button class="option" onclick="closeDeposit()">Tutup</button>
    </div>
</div>

<!-- Modal Withdraw Fake Interaktif -->
<div class="modal" id="withdrawModal">
    <div class="modal-content">
        <!-- Tampilan Form Input WD -->
        <div id="wdFormState">
            <h3>Form Withdraw</h3>
            
            <label class="wd-label">masukkan no dana</label>
            <input type="text" id="wdDanaInput" class="wd-input" placeholder="Contoh: 08123456xxxx" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
            
            <label class="wd-label">Nominal Penarikan (Rp)</label>
            <input type="text" id="wdNominalInput" class="wd-input" placeholder="Contoh: 1.000.000,50" oninput="formatWDInput(this)">
            
            <button class="option" style="background-color: #00bcd4; color: white;" onclick="prosesWithdraw()">tarik</button>
            <button class="option" onclick="closeWithdraw()">Batal</button>
        </div>
        
        <!-- Tampilan Sukses Hijau + Centang -->
        <div id="wdSuccessState" style="display: none;">
            <div class="success-checkmark">✔</div>
            <div class="wd-success-text">penarikan berhasil</div>
            <button class="option" style="background-color: #4CAF50; color: white;" onclick="closeWithdraw()">OK</button>
        </div>
    </div>
</div>

<div class="modal" id="betModal">
    <div class="modal-content">
        <h3>Pilih Bet</h3>
        <button class="option" onclick="setBet(0.50)">Rp0,50</button>
        <button class="option" onclick="setBet(0.90)">Rp0,90</button>
        <button class="option" onclick="setBet(1.00)">Rp1,00</button>
        <button class="option" onclick="setBet(5.00)">Rp5,00</button>
        <button class="option" onclick="setBet(10.00)">Rp10,00</button>
        <button class="option" onclick="setBet(20.00)">Rp20,00</button>
        <button class="option" onclick="setBet(100.00)">Rp100,00</button>
        <button class="option" onclick="closeBet()">Tutup</button>
    </div>
</div>

<div class="modal" id="autoModal">
    <div class="modal-content">
        <h3>Pilih Jumlah Auto Spin</h3>
        <button class="option" onclick="startAutoSpin(10)">Auto Spin 10x</button>
        <button class="option" onclick="startAutoSpin(20)">Auto Spin 20x</button>
        <button class="option" onclick="startAutoSpin(50)">Auto Spin 50x</button>
        <button class="option" onclick="startAutoSpin(100)">Auto Spin 100x</button>
        <hr style="margin: 10px 0;">
        <button class="option" onclick="closeAutoMenu()">Batal</button>
    </div>
</div>

<div class="modal" id="historyModal">
    <div class="modal-content">
        <h3>Riwayat Transaksi</h3>
        <div class="history-list" id="historyContainer"></div>
        <button class="option" style="background:#ff4d4d; color:white;" onclick="clearHistory()">Hapus Riwayat</button>
        <button class="option" onclick="closeHistoryModal()">Tutup</button>
    </div>
</div>

<script>
const emojiSettings = {
    "🀄": { nama: "Mahjong", x5: 473.32, x4: 15, x3: 3   }, 
    "🐉": { nama: "Naga",    x5: 273.98, x4: 10, x3: 2.5 },  
    "⚡": { nama: "Zeus",    x5: 50.00,  x4: 8,  x3: 2   }, 
    "🦊": { nama: "Rubah",   x5: 35.00,  x4: 5,  x3: 1.5 },  
    "⛩️": { nama: "Kuil",    x5: 25.00,  x4: 3,  x3: 1   },  
    "🐅": { nama: "Harimau", x5: 20.00,  x4: 2,  x3: 0.5 }   
};

const fruits = Object.keys(emojiSettings);

let saldo = localStorage.getItem("slot_saldo") ? parseFloat(localStorage.getItem("slot_saldo")) : 10.00;
let bet = 0.50;
let spinning = false;
let isTurbo = false;
let forceStopRequested = false; 
let autoSpinCount = 0;   
let isAutoSpinning = false; 
const intervals = {};
let cooldownInterval = null;

let logsAktivitas = localStorage.getItem("slot_logs") ? JSON.parse(localStorage.getItem("slot_logs")) : [];

function playLagu() {
    const audio = document.getElementById("bgMusic");
    if (audio && audio.paused) {
        audio.volume = 0.2;
        audio.play().catch(err => console.log("Audio otomatis dilewati."));
    }
}

function randomFruit(){
    return fruits[Math.floor(Math.random() * fruits.length)];
}

function randomFruitExcept(forbiddenArray){
    const allowed = fruits.filter(f => !forbiddenArray.includes(f));
    if(allowed.length === 0) return randomFruit();
    return allowed[Math.floor(Math.random() * allowed.length)];
}

function createTrack(id){
    const track = document.getElementById(id);
    track.innerHTML = "";
    for(let i=0;i<12;i++){
        const div = document.createElement("div");
        div.className = "item";
        div.textContent = randomFruit();
        track.appendChild(div);
    }
}

["r0","r1","r2","r3","r4"].forEach(createTrack);

function startReel(id){
    const track = document.getElementById(id);
    const reel = track.parentElement;
    reel.classList.add("spinning");

    const speed = isTurbo ? 60 : 120;

    intervals[id] = setInterval(()=>{
        const item = document.createElement("div");
        item.className = "item";
        item.textContent = randomFruit();
        track.prepend(item);

        track.style.transition = "none";
        track.style.transform = "translateY(-65px)";
        track.offsetHeight;

        track.style.transition = `transform ${speed/1000}s linear`;
        track.style.transform = "translateY(0px)";

        while(track.children.length > 12){
            track.removeChild(track.lastElementChild);
        }
    }, speed);
}

function stopReel(id, forcedFruit = null){
    clearInterval(intervals[id]);
    const track = document.getElementById(id);
    const reel = track.parentElement;
    reel.classList.remove("spinning");

    const fruit = forcedFruit ? forcedFruit : randomFruit();
    track.innerHTML = `<div class="item">${fruit}</div>`;
    return fruit;
}

function wait(ms){
    const finalMs = isTurbo ? ms * 0.15 : ms;
    return new Promise(resolve => setTimeout(resolve, finalMs));
}

function toggleTurbo() {
    isTurbo = !isTurbo;
    const turboBtn = document.getElementById("turboBtn");
    if(isTurbo) {
        turboBtn.textContent = "TURBO: ON";
        turboBtn.classList.add("active");
    } else {
        turboBtn.textContent = "TURBO: OFF";
        turboBtn.classList.remove("active");
    }
}

function formatMurni(nilai) {
    return nilai.toLocaleString("id-ID", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function catatRiwayat(tipe, teksNominal) {
    const waktuSekarang = new Date().toLocaleTimeString("id-ID", {hour: '2-digit', minute:'2-digit', second:'2-digit'});
    logsAktivitas.unshift({ waktu: waktuSekarang, tipe: tipe, detail: teksNominal });
    
    if(logsAktivitas.length > 40) logsAktivitas.pop();
    localStorage.setItem("slot_logs", JSON.stringify(logsAktivitas));
}

function openHistoryModal() {
    playLagu();
    if (spinning) return;
    
    const container = document.getElementById("historyContainer");
    container.innerHTML = "";
    
    if(logsAktivitas.length === 0) {
        container.innerHTML = "<div style='color:gray;text-align:center;padding:10px;'>Belum ada riwayat transaksi.</div>";
    } else {
        logsAktivitas.forEach(log => {
            const div = document.createElement("div");
            div.className = "history-item";
            
            if(log.tipe === "DEPO") {
                div.innerHTML = `[${log.waktu}] <span class="text-depo">DEPOSIT</span>: +Rp${log.detail}`;
            } else {
                div.innerHTML = `[${log.waktu}] <span class="text-win">MENANG</span>: +Rp${log.detail}`;
            }
            container.appendChild(div);
        });
    }
    document.getElementById("historyModal").style.display = "flex";
}

// Tutup riwayat modal
function closeHistoryModal() {
    document.getElementById("historyModal").style.display = "none";
}

function formatWDInput(input) {
    let cursorPosition = input.selectionStart;
    let originalLength = input.value.length;

    let value = input.value.replace(/[^0-9,]/g, '');
    
    let parts = value.split(',');
    if (parts.length > 2) {
        value = parts[0] + ',' + parts.slice(1).join('');
    }
    
    parts = value.split(',');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    
    input.value = parts.join(',');

    let newLength = input.value.length;
    cursorPosition = cursorPosition + (newLength - originalLength);
    input.setSelectionRange(cursorPosition, cursorPosition);
}

function openWithdraw() {
    playLagu();
    if(spinning || isAutoSpinning) return;
    
    document.getElementById("wdDanaInput").value = "";
    document.getElementById("wdNominalInput").value = "";
    document.getElementById("wdFormState").style.display = "block";
    document.getElementById("wdSuccessState").style.display = "none";
    
    document.getElementById("withdrawModal").style.display = "flex";
}

function closeWithdraw() {
    document.getElementById("withdrawModal").style.display = "none";
}

function prosesWithdraw() {
    const inputNo = document.getElementById("wdDanaInput").value;
    const rawNominal = document.getElementById("wdNominalInput").value;
    
    if(inputNo.trim() === "") {
        alert("Silakan masukkan nomor DANA terlebih dahulu!");
        return;
    }
    
    if(rawNominal.trim() === "") {
        alert("Masukkan nominal penarikan!");
        return;
    }
    
    let cleanedNominal = rawNominal.replace(/\./g, '').replace(/,/g, '.');
    const inputNominal = parseFloat(cleanedNominal);
    
    if(isNaN(inputNominal) || inputNominal <= 0) {
        alert("Masukkan nominal penarikan yang valid!");
        return;
    }
    
    if(inputNominal > saldo) {
        alert("Saldo Anda tidak mencukupi untuk melakukan penarikan ini!");
        return;
    }
    
    saldo -= inputNominal;
    updateUI(); 
    
    document.getElementById("wdFormState").style.display = "none";
    document.getElementById("wdSuccessState").style.display = "block";
}

function clearHistory() {
    logsAktivitas = [];
    localStorage.removeItem("slot_logs");
    openHistoryModal();
}

function updateUI(){
    localStorage.setItem("slot_saldo", saldo);

    document.getElementById("saldo").textContent = formatMurni(saldo);
    document.getElementById("betText").textContent = formatMurni(bet);
    
    const autoBox = document.getElementById("autoSpinBox");
    const spinBtn = document.getElementById("spinBtn");
    const autoMenuBtn = document.getElementById("autoMenuBtn");

    if(isAutoSpinning) {
        autoBox.style.display = "block";
        document.getElementById("autoCountText").textContent = autoSpinCount;
        autoMenuBtn.textContent = "STOP";
        autoMenuBtn.classList.add("btn-stop");
        autoMenuBtn.setAttribute("onclick", "stopAutoSpin()");
        spinBtn.style.opacity = "0.5";
        spinBtn.style.cursor = "not-allowed";
    } else {
        autoBox.style.display = "none";
        autoMenuBtn.textContent = "AUTO";
        autoMenuBtn.classList.remove("btn-stop");
        autoMenuBtn.setAttribute("onclick", "openAutoMenu()");
        
        if (spinning) {
            spinBtn.textContent = "STOP";
            spinBtn.classList.add("btn-stop");
            spinBtn.style.opacity = "1";
            spinBtn.style.cursor = "pointer";
        } else {
            spinBtn.textContent = "SPIN";
            spinBtn.classList.remove("btn-stop");
            spinBtn.style.opacity = "1";
            spinBtn.style.cursor = "pointer";
        }
    }
}

function pemicuCooldownDepo(durasiDetik) {
    const targetWaktu = Date.now() + (durasiDetik * 1000);
    localStorage.setItem("depo_cooldown_target", targetWaktu);
    jalankanCountdown();
}

function jalankanCountdown() {
    const targetWaktu = localStorage.getItem("depo_cooldown_target");
    if (!targetWaktu) return;

    const depoBtn = document.getElementById("depoBtn");

    if(cooldownInterval) clearInterval(cooldownInterval);

    cooldownInterval = setInterval(() => {
        const agora = Date.now();
        const sisaWaktu = targetWaktu - agora;

        if (sisaWaktu <= 0) {
            clearInterval(cooldownInterval);
            localStorage.removeItem("depo_cooldown_target");
            depoBtn.textContent = "depo";
            depoBtn.disabled = false;
        } else {
            depoBtn.disabled = true;
            const menit = Math.floor((sisaWaktu % (1000 * 60 * 60)) / (1000 * 60));
            const detik = Math.floor((sisaWaktu % (1000 * 60)) / 1000);
            
            const formatMenit = menit < 10 ? "0" + menit : menit;
            const formatDetik = detik < 10 ? "0" + detik : detik;
            
            depoBtn.textContent = `Depo (${formatMenit}:${formatDetik})`;
        }
    }, 1000);
}

function cekStatusCooldownAwal() {
    const targetWaktu = localStorage.getItem("depo_cooldown_target");
    if (targetWaktu && parseInt(targetWaktu) > Date.now()) {
        jalankanCountdown();
    }
}

function openDeposit(){ 
    playLagu(); 
    if(!spinning) document.getElementById("depositModal").style.display="flex"; 
}
function closeDeposit(){ document.getElementById("depositModal").style.display="none"; }

function addPoints(amount){ 
    saldo += amount; 
    catatRiwayat("DEPO", formatMurni(amount));
    updateUI(); 
    closeDeposit(); 
    pemicuCooldownDepo(1800); 
}

function openBet(){ playLagu(); if(!spinning && !isAutoSpinning) document.getElementById("betModal").style.display="flex"; }
function closeBet(){ document.getElementById("betModal").style.display="none"; }
function setBet(value){ bet = value; updateUI(); closeBet(); }

function openAutoMenu(){
    playLagu();
    if(spinning || isAutoSpinning) return;
    document.getElementById("autoModal").style.display = "flex";
}

function closeAutoMenu(){
    document.getElementById("autoModal").style.display = "none";
}

function handleSpinClick() {
    playLagu();
    if (isAutoSpinning) return;

    if (!spinning) {
        runSingleSpin();
    } else {
        forceStopRequested = true;
    }
}

function pemicuAnimasiMenang(tipe, emoji) {
    const totalPartikel = tipe === 5 ? 35 : (tipe === 4 ? 15 : 6);
    const container = document.getElementById("mainContainer");

    if (tipe === 5) {
        container.classList.add("shake-screen");
        setTimeout(() => container.classList.remove("shake-screen"), 2500);
    }

    for (let i = 0; i < totalPartikel; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.textContent = emoji;

        if (tipe === 3) {
            p.classList.add("p-triple");
            p.style.left = (window.innerWidth / 2 - 150 + Math.random() * 300) + "px";
            p.style.top = (window.innerHeight / 2 - 50 + Math.random() * 100) + "px";
            p.style.fontSize = (20 + Math.random() * 25) + "px";
        } else if (tipe === 4) {
            p.classList.add("p-quad");
            p.style.left = "50%";
            p.style.top = "50%";
            p.style.fontSize = (30 + Math.random() * 25) + "px";
            
            const sudut = Math.random() * Math.PI * 2;
            const jarak = 150 + Math.random() * 250;
            p.style.setProperty('--tx', Math.cos(sudut) * jarak + "px");
            p.style.setProperty('--ty', Math.sin(sudut) * jarak + "px");
        } else if (tipe === 5) {
            p.classList.add("p-jackpot");
            p.style.left = (Math.random() * 100) + "vw";
            p.style.top = "-50px";
            p.style.fontSize = (35 + Math.random() * 40) + "px";
            p.style.setProperty('--dur', (1.5 + Math.random() * 2) + "s");
            p.style.animationDelay = (Math.random() * 1.5) + "s";
        }

        document.body.appendChild(p);
        setTimeout(() => p.remove(), 3500);
    }
}

function startAutoSpin(jumlah){
    playLagu();
    closeAutoMenu();
    autoSpinCount = jumlah;
    isAutoSpinning = true;
    updateUI();
    runSingleSpin();
}

function stopAutoSpin(){
    autoSpinCount = 0;
    isAutoSpinning = false;
    updateUI();
}

async function runSingleSpin(){
    if(spinning) return;

    if(saldo < bet){
        document.getElementById("result").textContent = "pitih ndak adoh bajudi lo mah";
        stopAutoSpin();
        return;
    }

    spinning = true;
    forceStopRequested = false; 
    saldo -= bet;
    updateUI();
    document.getElementById("result").textContent = "";

    startReel("r0");
    startReel("r1");
    startReel("r2");
    startReel("r3");
    startReel("r4");

    let targetCombo = 0; 
    let winEmoji = "";
    
    let rng = Math.random() * 100;

    if (rng < 1.0) {          
        targetCombo = 5; winEmoji = "🀄"; 
    } else if (rng < 2.0) {   
        targetCombo = 5; winEmoji = "🐉"; 
    } else if (rng < 2.75) {   
        targetCombo = 5; winEmoji = "⚡"; 
    } else if (rng < 3.50) {   
        targetCombo = 5; winEmoji = "🦊"; 
    } else if (rng < 4.25) {  
        targetCombo = 5; winEmoji = "⛩️"; 
    } else if (rng < 5.00) {  
        targetCombo = 5; winEmoji = "🐅"; 
    } else if (rng < 8.00) {  
        targetCombo = 4;                 
    } else if (rng < 16.00) {  
        targetCombo = 3;                 
    } else {                  
        targetCombo = 0;                 
    }

    let finalResults = [];
    if (targetCombo >= 3) {
        if(winEmoji === "") winEmoji = randomFruit();
        
        for (let i = 0; i < targetCombo; i++) {
            finalResults.push(winEmoji);
        }
        while (finalResults.length < 5) {
            finalResults.push(randomFruitExcept([winEmoji]));
        }
        finalResults.sort(() => Math.random() - 0.5);
    } else {
        let e0 = randomFruit();
        let e1 = randomFruitExcept([e0]);
        let e2 = randomFruitExcept([e0, e1]);
        finalResults = [e0, e1, e2, randomFruit(), randomFruit()];
    }

    if(!forceStopRequested) await wait(800);
    stopReel("r0", finalResults[0]);

    if(!forceStopRequested) await wait(250);
    stopReel("r1", finalResults[1]);

    if(!forceStopRequested) await wait(250);
    stopReel("r2", finalResults[2]);

    if(!forceStopRequested) await wait(250);
    stopReel("r3", finalResults[3]);

    if(!forceStopRequested) await wait(250);
    stopReel("r4", finalResults[4]);

    let finalCounts = {};
    finalResults.forEach(x => finalCounts[x] = (finalCounts[x] || 0) + 1);

    let menangEmoji = "";
    let jumlahKembar = 0;

    for(let emoji in finalCounts) {
        if(finalCounts[emoji] > jumlahKembar) {
            jumlahKembar = finalCounts[emoji];
            menangEmoji = emoji;
        }
    }
    
    let hadiah = 0;
    let pesan = "ZONK! Coba Lagi."; 

    if (jumlahKembar >= 3) {
        let keyX = "x" + jumlahKembar; 
        let pengali = emojiSettings[menangEmoji][keyX];
        hadiah = bet * pengali; 
        
        catatRiwayat("WIN", `${formatMurni(hadiah)} (${emojiSettings[menangEmoji].nama})`);

        if (jumlahKembar === 5) {
            pesan = `😈 JACKPOT MUTLAK 5 KEMBAR (${emojiSettings[menangEmoji].nama})! +Rp${formatMurni(hadiah)}`;
        } else if (jumlahKembar === 4) {
            pesan = `🔥 MEGA WIN 4 KEMBAR (${emojiSettings[menangEmoji].nama})! +Rp${formatMurni(hadiah)}`;
        } else if (jumlahKembar === 3) {
            pesan = `😡GACOR 3 KEMBAR (${emojiSettings[menangEmoji].nama})! +Rp${formatMurni(hadiah)}`;
        }
        
        pemicuAnimasiMenang(jumlahKembar, menangEmoji);
    }
    saldo += hadiah;
    spinning = false;
    forceStopRequested = false;
    updateUI();

    document.getElementById("result").textContent = pesan;

    if(isAutoSpinning){
        autoSpinCount--;
        if(autoSpinCount <= 0){
            isAutoSpinning = false;
        }
        updateUI();
        if(isAutoSpinning){
            // UPDATE JEDA COOLDOWN SPIN:
            // Jika mendapatkan kembar 5, sistem otomatis ditahan selama 4500ms (4.5 detik) agar animasi tuntas.
            if (jumlahKembar === 5) {
                await wait(4500); 
            } else if (jumlahKembar === 4 || jumlahKembar === 3) {
                await wait(3500); 
            } else {
                await wait(1000); 
            }
            
            if (isAutoSpinning) {
                runSingleSpin();
            }
        }
    }
}
updateUI();
cekStatusCooldownAwal();
</script>
