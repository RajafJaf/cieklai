<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slot gacor abizz maxwin</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,red,gray,cyan);
}

.container{
    text-align:center;
    color:white;
    width:95%;
    max-width:700px;
}

h1{
    margin-bottom:20px;
}

.machine{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:20px 0;
}

.reel{
    width:120px;
    height:120px;
    overflow:hidden;
    background:white;
    border-radius:15px;
    border:4px solid gold;
    position:relative;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.reel.spinning{
    filter:blur(2px);
}

.track{
    position:absolute;
    width:100%;
    top:0;
    left:0;
    will-change:transform;
}

.item{
    width:100%;
    height:120px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:70px;
    user-select:none;
}

.info{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.box{
    background:rgba(255,255,255,.2);
    padding:10px 15px;
    border-radius:10px;
}

.controls{
    margin-top:15px;
}

button{
    padding:12px 20px;
    margin:5px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

#result{
    margin-top:15px;
    font-size:24px;
    font-weight:bold;
}

/* Modal */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    color:black;
    padding:20px;
    border-radius:15px;
    width:300px;
}

.modal-content h3{
    margin-bottom:10px;
}

.option{
    width:100%;
    margin:5px 0;
}
</style>
</head>
<body>

<div class="container">

    <h1>🀄SLOT GACOR🀄</h1>

    <div class="machine">
        <div class="reel">
            <div class="track" id="r1"></div>
        </div>

        <div class="reel">
            <div class="track" id="r2"></div>
        </div>

        <div class="reel">
            <div class="track" id="r3"></div>
        </div>
    </div>

    <div class="info">
        <div class="box">
            Saldo: <span id="saldo">10.000</span> Poin
        </div>

        <div class="box">
            Bet: <span id="betText">500</span> Poin
        </div>
    </div>

    <div class="controls">
        <button onclick="openDeposit()">
            depo
        </button>

        <button onclick="openBet()">
            Bet
        </button>

        <button onclick="spin()">
            SPIN
        </button>
    </div>

    <div id="result"></div>

</div>

<!-- Modal Tambah Poin -->

<div class="modal" id="depositModal">
    <div class="modal-content">

        <h3>deposit</h3>

        <button class="option" onclick="addPoints(10000)">Rp10.000</button>
        <button class="option" onclick="addPoints(50000)">Rp50.000</button>
        <button class="option" onclick="addPoints(100000)">Rp100.000</button>
        <button class="option" onclick="addPoints(200000)">Rp200.000</button>
        <button class="option" onclick="addPoints(500000)">Rp500.000</button>
        <button class="option" onclick="addPoints(1000000)">Rp1.000.000</button>

        <button class="option" onclick="closeDeposit()">
            Tutup
        </button>

    </div>
</div>

<!-- Modal Bet -->

<div class="modal" id="betModal">
    <div class="modal-content">

        <h3>Pilih Bet</h3>

        <button class="option" onclick="setBet(500)">Rp.500</button>
        <button class="option" onclick="setBet(900)">Rp900</button>
        <button class="option" onclick="setBet(1000)">Rp1.000</button>
        <button class="option" onclick="setBet(5000)">Rp5.000</button>
        <button class="option" onclick="setBet(10000)">Rp10.000</button>
        <button class="option" onclick="setBet(20000)">Rp20.000</button>
        <button class="option" onclick="setBet(100000)">Rp100.000</button>

        <button class="option" onclick="closeBet()">
            Tutup
        </button>

    
</div>

<script>
const fruits = [
    "🀄","🎴","🐉","🐅",
    //"🍓","🍒","🍍","🥝"
];

let saldo = 10000;
let bet = 500;
let spinning = false;
const intervals = {};

function randomFruit(){
    return fruits[
        Math.floor(Math.random()*fruits.length)
    ];
}

function createTrack(id){

    const track = document.getElementById(id);

    track.innerHTML = "";

    for(let i=0;i<12;i++){

        const div = document.createElement("div");

        div.className = "item";
        div.textContent = randomFruit();

        track.appendChild(div);
    }
}

["r1","r2","r3"].forEach(createTrack);

function startReel(id){

    const track = document.getElementById(id);
    const reel = track.parentElement;

    reel.classList.add("spinning");

    intervals[id] = setInterval(()=>{

        const item = document.createElement("div");

        item.className = "item";
        item.textContent = randomFruit();

        track.prepend(item);

        track.style.transition = "none";
        track.style.transform =
            "translateY(-120px)";

        track.offsetHeight;

        track.style.transition =
            "transform .12s linear";

        track.style.transform =
            "translateY(0px)";

        while(track.children.length > 12){
            track.removeChild(
                track.lastElementChild
            );
        }

    },120);
}

function stopReel(id){

    clearInterval(intervals[id]);

    const track = document.getElementById(id);
    const reel = track.parentElement;

    reel.classList.remove("spinning");

    const fruit = randomFruit();

    track.innerHTML =
        `<div class="item">${fruit}</div>`;

    return fruit;
}

function wait(ms){
    return new Promise(
        resolve => setTimeout(resolve,ms)
    );
}

function updateUI(){

    document.getElementById("saldo")
    .textContent =
    saldo.toLocaleString("id-ID");

    document.getElementById("betText")
    .textContent =
    bet.toLocaleString("id-ID");
}

function openDeposit(){
    document.getElementById(
        "depositModal"
    ).style.display="flex";
}

function closeDeposit(){
    document.getElementById(
        "depositModal"
    ).style.display="none";
}

function addPoints(amount){
    saldo += amount;
    updateUI();
    closeDeposit();
}

function openBet(){
    document.getElementById(
        "betModal"
    ).style.display="flex";
}

function closeBet(){
    document.getElementById(
        "betModal"
    ).style.display="none";
}

function setBet(value){
    bet = value;
    updateUI();
    closeBet();
}

async function spin(){

    if(spinning) return;

    if(saldo < bet){

        document.getElementById(
            "result"
        ).textContent =
        "❌ saldo tidak cukup";

        return;
    }

    spinning = true;

    saldo -= bet;
    updateUI();

    document.getElementById(
        "result"
    ).textContent = "";

    startReel("r1");
    startReel("r2");
    startReel("r3");

    await wait(2500);
    const a = stopReel("r1");

    await wait(1000);
    const b = stopReel("r2");

    await wait(1000);
    const c = stopReel("r3");

    let hadiah = 0;
    let pesan = "ke poke!";

    if(a===b && b===c){

        hadiah = bet * 378.3;

        pesan =
        `😈GACOR! +${hadiah.toLocaleString("id-ID")} Poin`;

    }else if(
        a===b ||
        b===c ||
        a===c
    ){

        hadiah = bet * 5.7;

        pesan =
        `mayan mah! +${hadiah.toLocaleString("id-ID")} Poin`;
    }

    saldo += hadiah;

    updateUI();

    document.getElementById(
        "result"
    ).textContent = pesan;

    spinning = false;
}

updateUI();
</script>

</body>
</html>
