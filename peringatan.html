<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotak Peringatan</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        /* Desain Tombol Menggunakan Tag 'A' */
.btn-continue {
    display: inline-block;
    text-decoration: none;
    background-color: #ff4d4d;
    color: white;
    padding: 12px 30px;
    font-size: 16px;
    font-weight: 500;
    border-radius: 25px;
    transition: background-color 0.3s ease, transform 0.1s ease;
    box-shadow: 0 4px 12px rgba(255, 77, 77, 0.3);

    /* 1. Mencegah teks terblok/tersorot biru */
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;

    /* 2. Mencegah kotak biru/garis luar saat tombol diklik (PC) */
    outline: none;

    /* 3. Mencegah kotak/highlight biru saat tombol ditekan (HP/Mobile) */
    -webkit-tap-highlight-color: transparent;
}

/* Biar tetap aman, kita ganti kotak birunya dengan efek hover yang halus */
.btn-continue:hover {
    background-color: #e03e3e;
}

.btn-continue:active {
    transform: scale(0.98);
}


        .alert-box {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border-top: 6px solid #ff4d4d;
        }

        .alert-icon {
            font-size: 48px;
            color: #ff4d4d;
            margin-bottom: 15px;
        }

        .alert-title {
            color: #333333;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 22px;
            font-weight: 600;
        }

        .alert-text {
            color: #666666;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Desain Tombol Menggunakan Tag 'A' */
        .btn-continue {
            display: inline-block; /* Agar bisa diberi padding & margin seperti tombol */
            text-decoration: none; /* Menghilangkan garis bawah khas link browser */
            background-color: #ff4d4d;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 25px;
            transition: background-color 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(255, 77, 77, 0.3);

            /* Mencegah highlight biru & seleksi teks saat diklik/disalin */
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none;    /* Firefox */
            -ms-user-select: none;     /* IE10+/Edge */
            user-select: none;         /* Standar (Chrome, Opera, dll) */
        }

        .btn-continue:hover {
            background-color: #e03e3e;
        }

        .btn-continue:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="alert-box">
        <div class="alert-icon">⚠️</div> 
        <h2 class="alert-title">Perhatian!</h2>
        <p class="alert-text">ini adalah web judi judol onglen aseli depo pakai uang aseli dan penarikan dalam pengembangan jadi  berjudi lah haanya di web ini ya,kalo di web lain jangan bahaya kata mama ga boleh🤣😹😑😈😫🤬😫❗😆🤣🐔😫🐔😫☹️
        </p>
        
        <a href="judjud.html" class="btn-continue">
            Lanjut
        </a>
    </div>

</body>
</html>
